name: Realtime Agent CI

on:
  push:
    branches: [main]
    paths:
      - 'services/realtime-agent/**'
      - '.github/workflows/realtime-agent-ci.yml'
  pull_request:
    paths:
      - 'services/realtime-agent/**'
      - '.github/workflows/realtime-agent-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile agent
        run: python -m compileall -q agent.py

      - name: Import smoke test
        run: python -c "import agent; print('realtime agent import: ok')"

      - name: Build Docker image
        run: docker build -t interview-realtime-agent:ci .
