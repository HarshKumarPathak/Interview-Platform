name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - "services/**"
      - "packages/database/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interview_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare local environment
        run: pnpm env:setup

      - name: Start database schema
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: node --test tests/*.test.mjs && pnpm test

      - name: Authentication E2E
        shell: bash
        run: |
          pnpm --filter @interview-platform/web dev > web-e2e.log 2>&1 &
          echo $! > web-e2e.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/login > /dev/null
          AUTH_E2E_BASE_URL=http://127.0.0.1:3000 node --test tests/auth-e2e.test.mjs
          kill $(cat web-e2e.pid)

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate realtime agent syntax
        working-directory: services/realtime-agent
        run: python -m compileall -q agent.py

      - name: Validate realtime agent dependencies
        working-directory: services/realtime-agent
        run: python -m pip install -r requirements.txt

      - name: Build realtime agent image
        working-directory: services/realtime-agent
        run: docker build -t interview-realtime-agent:ci .
