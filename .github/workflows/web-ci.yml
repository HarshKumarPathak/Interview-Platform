name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - "services/**"
      - "packages/database/**"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: node --test tests/*.test.mjs && pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate realtime agent syntax
        working-directory: services/realtime-agent
        run: python -m compileall -q agent.py

      - name: Validate realtime agent dependencies
        working-directory: services/realtime-agent
        run: python -m pip install -r requirements.txt

      - name: Build realtime agent image
        working-directory: services/realtime-agent
        run: docker build -t interview-realtime-agent:ci .
