name: Realtime Agent Staging Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: realtime-agent-staging
    concurrency:
      group: realtime-agent-staging
      cancel-in-progress: true
    defaults:
      run:
        working-directory: services/realtime-agent
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      LIVEKIT_AGENT_ID: ${{ secrets.LIVEKIT_AGENT_ID }}
      SECRET_LIST: >-
        OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},
        WEB_APP_URL=${{ secrets.WEB_APP_URL }},
        LIVEKIT_AGENT_SHARED_SECRET=${{ secrets.LIVEKIT_AGENT_SHARED_SECRET }},
        AI_ENGINE_URL=${{ secrets.AI_ENGINE_URL }},
        OPENAI_REALTIME_MODEL=${{ secrets.OPENAI_REALTIME_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Validate deployment credentials
        run: |
          test -n "$LIVEKIT_URL"
          test -n "$LIVEKIT_API_KEY"
          test -n "$LIVEKIT_API_SECRET"
          test -n "$LIVEKIT_AGENT_ID"
          test -n "${{ secrets.OPENAI_API_KEY }}"
          test -n "${{ secrets.WEB_APP_URL }}"
          test -n "${{ secrets.LIVEKIT_AGENT_SHARED_SECRET }}"
          test -n "${{ secrets.AI_ENGINE_URL }}"
          test -n "${{ secrets.OPENAI_REALTIME_MODEL }}"

      - name: Generate LiveKit agent config
        run: lk agent config --id "$LIVEKIT_AGENT_ID" .

      - name: Deploy staging agent
        run: lk agent deploy --deployment staging
